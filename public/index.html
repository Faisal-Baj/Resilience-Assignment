<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Items · Remediation Workspace</title>
  <link rel="stylesheet" href="/app.css">
  <script type="module" src="/js/inbox.js"></script>
</head>
<body>
  <header id="app-header"></header>

  <main class="mx-auto max-w-5xl px-4 py-6">
    <div class="flex flex-wrap items-center justify-between gap-3">
      <h1 class="text-xl font-semibold text-white">Remediation items</h1>
      <a id="new-item" href="/item-form" class="btn btn-primary" hidden>New item</a>
    </div>

    <form id="filters" class="mt-4 grid gap-3 sm:max-w-lg sm:grid-cols-2">
      <div>
        <label for="status" class="label">Status</label>
        <select id="status" name="status" class="input">
          <option value="">All statuses</option>
          <option value="OPEN">Open</option>
          <option value="IN_PROGRESS">In progress</option>
          <option value="PENDING_REVIEW">Pending review</option>
          <option value="CLOSED">Closed</option>
        </select>
      </div>
      <div>
        <label for="overdue" class="label">Due date</label>
        <select id="overdue" name="overdue" class="input">
          <option value="">Any due date</option>
          <option value="true">Overdue only</option>
          <option value="false">Not overdue</option>
        </select>
      </div>
    </form>

    <!-- Only one of these states is visible at a time -->
    <p id="list-loading" class="mt-6 text-sm text-slate-400" role="status" hidden>Loading items…</p>
    <p id="list-empty" class="card mt-6 text-center text-sm text-slate-400" hidden>No items match these filters.</p>
    <div id="list-error" class="alert-error mt-6 flex flex-wrap items-center justify-between gap-3" role="alert" hidden>
      <span data-message></span>
      <button id="retry" type="button" class="btn btn-secondary">Try again</button>
    </div>

    <ul id="item-list" class="mt-6 grid gap-x-4 gap-y-6 sm:grid-cols-2"></ul>

    <nav id="pagination" class="mt-6 flex items-center justify-between gap-3" aria-label="Pagination" hidden>
      <button id="prev-page" type="button" class="btn btn-secondary">Previous</button>
      <span id="page-info" class="text-center text-sm text-slate-400"></span>
      <button id="next-page" type="button" class="btn btn-secondary">Next</button>
    </nav>
  </main>

  <template id="item-row">
    <li>
      <a data-link class="folder">
        <div data-badges class="folder-tab"></div>
        <div class="folder-body">
          <h2 data-title class="font-medium break-words text-white"></h2>
          <p class="mt-3 text-sm text-slate-400">
            Assigned to <span data-assignee class="font-medium text-slate-200"></span>
          </p>
          <p class="mt-1 text-sm text-slate-400">Due <span data-due class="text-slate-200"></span></p>
        </div>
      </a>
    </li>
  </template>
</body>
</html>
