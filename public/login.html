<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · Remediation Workspace</title>
  <link rel="stylesheet" href="/app.css">
  <script type="module" src="/js/login.js"></script>
</head>
<body>
  <main class="mx-auto flex min-h-screen max-w-sm flex-col justify-center px-4 py-12">
    <h1 class="text-center text-2xl font-semibold text-white">Remediation <span class="brand-gradient">Workspace</span></h1>
    <p class="mt-1 text-center text-sm text-mist">Sign in with your work account</p>

    <div id="notice" class="alert-info mt-6" role="status" hidden></div>

    <form id="login-form" class="card mt-6 space-y-4" novalidate>
      <div id="form-error" class="alert-error" role="alert" hidden></div>

      <div>
        <label for="email" class="label">Email</label>
        <input id="email" name="email" type="email" autocomplete="username" required class="input">
      </div>

      <div>
        <label for="password" class="label">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required class="input">
      </div>

      <button type="submit" class="btn btn-primary w-full">Sign in</button>
    </form>
  </main>
</body>
</html>
